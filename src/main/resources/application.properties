spring.application.name=quiz-backend
server.port=${PORT:8080}

# ---- Database (env-driven) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- HikariCP (connection pool) ----
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=15000

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- Google OAuth ----
app.google.client-id=${GOOGLE_CLIENT_ID}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Health endpoint (for UptimeRobot) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- AI Configuration ----
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-flash-lite-latest}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:gemini-embedding-001}
app.ai.embedding-dimensions=3072
app.ai.max-concurrent-requests=3
app.ai.max-retries=3
app.ai.timeout-seconds=60

# ---- File Upload ----
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ---- Async ----
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=10